<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WasteWise – Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --grad:        linear-gradient(155deg, #05386b 0%, #0a5a6e 22%, #1a8a6e 55%, #2db87a 78%, #5cdb95 100%);
      --accent:      #1a8a6e;
      --accent-btn:  #0d4f5c;
      --card-bg:     #ffffff;
      --text-dark:   #0d3a3a;
      --text-mid:    #3a6060;
      --text-muted:  #7a9a9a;
      --label:       #4a6e6e;
      --input-bg:    #f5fafa;
      --input-bd:    #cde4e4;
      --input-focus: #1a8a6e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      background: var(--grad);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
      position: relative; overflow: hidden;
    }

    /* ── Smooth radial overlays only — NO grid ── */
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 5% 95%,  rgba(92,219,149,0.22) 0%, transparent 42%),
        radial-gradient(ellipse at 95% 5%,  rgba(5,56,107,0.55)   0%, transparent 42%),
        radial-gradient(ellipse at 50% 50%, rgba(26,138,110,0.1)  0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ── Soft leaf shapes (like Image 2) ── */
    .leaf {
      position: fixed; pointer-events: none; z-index: 0;
      border-radius: 0 60% 0 60%;
      opacity: 0.12;
    }
    .leaf-1 { width: 340px; height: 340px; background: rgba(255,255,255,0.18); top: -80px; left: -80px; transform: rotate(20deg); }
    .leaf-2 { width: 240px; height: 240px; background: rgba(255,255,255,0.12); bottom: -60px; left: 60px; transform: rotate(80deg); }
    .leaf-3 { width: 200px; height: 200px; background: rgba(92,219,149,0.2);   top: 30%;  right: -50px; transform: rotate(210deg); }

    /* ── Floating orbs ── */
    .orb { position: fixed; border-radius: 50%; filter: blur(110px); pointer-events: none; z-index: 0; animation: drift 14s ease-in-out infinite; }
    .orb-a { width: 500px; height: 500px; background: rgba(92,219,149,0.12); top: -160px; right: -120px; }
    .orb-b { width: 380px; height: 380px; background: rgba(5,56,107,0.45);   bottom: -130px; left: -100px; animation-delay: 6s; }
    @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-28px); } }

    /* ── Page wrapper ── */
    .page {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      animation: up 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes up { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }

    /* ── Brand header ── */
    .brand {
      text-align: center; margin-bottom: 2rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
    }
    .brand-logo { display: flex; align-items: center; gap: 0.5rem; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
    }
    .brand-name {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 1.8rem; color: #ffffff; letter-spacing: -0.4px;
    }
    .brand-tag {
      font-size: 0.68rem; color: rgba(255,255,255,0.6);
      letter-spacing: 3.5px; text-transform: uppercase; font-weight: 400;
    }

    /* ── White card ── */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 2.6rem 2.4rem;
      box-shadow: 0 30px 80px rgba(5,56,107,0.35), 0 4px 20px rgba(0,0,0,0.1);
    }

    /* Card header — centred like Image 1 */
    .card-head { text-align: center; margin-bottom: 2rem; }
    .card-title {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 1.65rem; color: var(--text-dark);
      letter-spacing: -0.4px; margin-bottom: 0.3rem;
    }
    .card-sub { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }

    /* ── Form ── */
    .field { margin-bottom: 1.2rem; }
    .lrow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem; }

    .flabel {
      display: block;
      font-size: 0.72rem; font-weight: 700;
      color: var(--label); letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 0.45rem;
    }
    .lrow .flabel { margin: 0; }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    input[type="tel"] {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-bd);
      border-radius: 10px;
      padding: 0.82rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; color: var(--text-dark);
      outline: none; transition: all 0.25s;
    }
    input::placeholder { color: #b0c8c8; }
    input:focus {
      border-color: var(--input-focus);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(26,138,110,0.1);
    }
    input.err { border-color: #d94f4f; box-shadow: 0 0 0 3px rgba(217,79,79,0.1); }

    .forgot {
      font-size: 0.75rem; color: var(--accent);
      text-decoration: none; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .forgot:hover { opacity: 0.7; }

    /* Checkbox */
    .chk { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 1.6rem; }
    .chk input[type="checkbox"] {
      width: 17px; height: 17px; appearance: none; -webkit-appearance: none;
      border: 1.5px solid var(--input-bd); border-radius: 5px;
      background: var(--input-bg); cursor: pointer; flex-shrink: 0;
      position: relative; transition: all 0.2s;
    }
    .chk input:checked { background: var(--accent); border-color: var(--accent); }
    .chk input:checked::after {
      content: '✓'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%); font-size: 0.6rem; color: white; font-weight: 900;
    }
    .chk-lbl { font-size: 0.875rem; color: var(--text-mid); cursor: pointer; }

    /* Button */
    .btn {
      width: 100%; padding: 0.92rem;
      background: var(--accent-btn);
      border: none; border-radius: 10px;
      color: #ffffff; font-family: 'Syne', sans-serif;
      font-size: 1rem; font-weight: 700; letter-spacing: 0.3px;
      cursor: pointer; transition: all 0.3s;
      box-shadow: 0 4px 18px rgba(13,79,92,0.35);
    }
    .btn:hover { background: #0a3d4a; transform: translateY(-2px); box-shadow: 0 8px 26px rgba(13,79,92,0.45); }
    .btn:active { transform: translateY(0); }

    /* Divider */
    .div { display: flex; align-items: center; gap: 0.75rem; margin: 1.5rem 0; }
    .div::before, .div::after { content: ''; flex: 1; height: 1px; background: #e2eeee; }
    .div span { font-size: 0.75rem; color: var(--text-muted); }

    /* Footer */
    .foot { text-align: center; font-size: 0.9rem; color: var(--text-mid); }
    .foot a { color: var(--accent); font-weight: 700; text-decoration: none; transition: opacity 0.2s; font-size: 1rem; }
    .foot a:hover { opacity: 0.7; }

    /* Google button */
    .btn-google {
      width: 100%; padding: 0.88rem;
      background: #ffffff;
      border: 1.5px solid var(--input-bd);
      border-radius: 10px;
      color: var(--text-dark);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 0.65rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .btn-google:hover { background: #f5fafa; border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.1); }
    .btn-google:active { transform: translateY(0); }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      .card-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <!-- Smooth background shapes only -->
  <div class="leaf leaf-1"></div>
  <div class="leaf leaf-2"></div>
  <div class="leaf leaf-3"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <div class="page">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo">
        <div class="brand-icon">♻</div>
        <span class="brand-name">WasteWise</span>
      </div>
      <div class="brand-tag">Local Recycling Initiative Tracker</div>
    </div>

    <!-- White card -->
    <div class="card">
      <!-- Centred heading like Image 1 -->
      <div class="card-head">
        <div class="card-title">Welcome back</div>
        <div class="card-sub">Sign in to continue to your dashboard</div>
      </div>

      <form action="javascript:void(0)">
        <div class="field">
          <label class="flabel">Email Address</label>
          <input type="email" autocomplete="email"/>
        </div>

        <div class="field">
          <div class="lrow">
            <label class="flabel">Password</label>
            <a href="reset-password.html" class="forgot">Forgot Password?</a>
          </div>
          <input type="password" placeholder="Enter your password" autocomplete="current-password"/>
        </div>

        <div class="chk">
          <input type="checkbox" id="rem">
          <label class="chk-lbl" for="rem">Keep me signed in</label>
        </div>

        <button type="submit" class="btn">Sign In</button>
      </form>

      <div class="div"><span>or continue with</span></div>

      <button type="button" class="btn-google">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="div"><span>new to WasteWise?</span></div>
      <div class="foot">
        <a href="signup.html">Create a free account</a>
      </div>

    </div>
  </div>
</body>
</html>
