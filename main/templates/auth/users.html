{% extends "admin/base.html" %}
{% block content %}


    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/rewards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/auth/signup.css') }}">


    <main class="page">
        <div class="page-header" data-aos="fade-up">
            <h2>⚙️ Manage Users</h2>
            <p>View and update/promote users on system.</p>
        </div>


         <div class="row g-4">

                {% for user in users  %}

                    <!-- Eco Bottle -->
                    <div class="col-lg-4 col-md-6" data-aos="zoom-in">
                        <div class="reward-card">
                            <div class="reward-icon" style="display:flex; justify-content:center">
                                <img style="max-width:300px;max-height: 350px; background:none" src="{{ url_for('static', filename='images/default-profile-account.jpg') }}" />
                            </div>
                            <h4 class="reward-title">{{user.first_name}}  {{user.last_name}}</h4>
                            <p class="reward-points">{{user.email}}</strong></p>
                            <div class="reward-actions">
                                <a style="text-decoration:none" href="{{url_for('/auth.account', id=user.id)}}" class="btn-edit">✏️ View/Edit User</a>
                            </div>
                        </div>
                    </div>


                {% endfor %}

            </div>
    </main>
   

{% endblock %}
