{% extends "auth/base.html" %}
{% block content %}

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/reset_request.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/auth/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/auth/signup.css') }}">
<style> 
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .page {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
        padding: 2rem 1rem;
    }
    
</style>

    <section >
         <div class="page">
    <div class="brand">
      <div class="brand-logo">
        <div class="brand-icon">♻</div>
        <span class="brand-name">WasteWise</span>
      </div>
      <div class="brand-tag">Local Recycling Initiative Tracker</div>
    </div>
<style>
    .page {max-width: 620px;
        width: 100;
        margin: 0 auto;
        padding: 2rem 1rem; 

    }
    .card{
        width: 100%;
        padding: 2.6rem 3rem;

    }
</style>

    <div class="card">

      <!-- ══ STEP 1 — Enter email ══ -->
      <div id="p1" class="sv">
        
        <div class="steps">
          <div class="step active"></div>
          <div class="step active"></div>
          
        </div>
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        
        <form  action="{{url_for('/auth.confirm_otp', action=action)}}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="field">
            <label class="flabel">6 digit OTP</label>
            <input name="otpcode" type="text" id="eVal" required />
            <div class="err-msg" id="emailErr"></div>
            </div>

            <button class="btn" onclick="doStep1()">Submit</button>

        </form>
      </div>

    

    </div>
  </div>
<script>
    const ALL = ['p1','p2','p3','p4'];

    function go(id) {
      ALL.forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
    }

    function doStep1() {
      const el = document.getElementById('eVal');
      const val = el.value.trim().toLowerCase();
      if (!val || !val.endsWith('@gmail.com')) {
        el.classList.add('err');
        document.getElementById('emailErr').style.display = 'block';
        return;
      }
      el.classList.remove('err');
      document.getElementById('emailErr').style.display = 'none';
      document.getElementById('eShow').textContent = val;
      go('p2');
    }

    const cols = { 1:'#d94f4f', 2:'#e8a020', 3:'#1a8a6e', 4:'#2db87a' };

    function checkStr() {
      const v = document.getElementById('npw').value;
      const c = { len: v.length>=8, up: /[A-Z]/.test(v), num: /[0-9]/.test(v), sp: /[^A-Za-z0-9]/.test(v) };
      ['rn1','rn2','rn3','rn4'].forEach((id,i) => document.getElementById(id).classList.toggle('met', Object.values(c)[i]));
      const sc = Object.values(c).filter(Boolean).length;
      [1,2,3,4].forEach(n => { document.getElementById('n'+n).style.background = sc>=n ? cols[sc] : '#dde8e8'; });
    }

    function doReset() {
      const np = document.getElementById('npw').value;
      const cp = document.getElementById('cpw').value;
      const cfEl = document.getElementById('cpw');
      const errEl = document.getElementById('pwErr');
      if (np !== cp) { cfEl.classList.add('err'); errEl.style.display = 'block'; return; }
      cfEl.classList.remove('err'); errEl.style.display = 'none';
      go('p4');
    }
  </script>



        
    </section>

    <script src="{{url_for('static', filename='default/js/reset_request.js') }}"></script>


{% endblock %}

































<div class="step active fade-up" id="step-email">
            <form method="post" action="{{url_for('/auth.reset_request')}}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="icon-wrap">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M2 7l10 7 10-7"/>
                </svg>
                </div>
                <div>
                <h1>Verify your email</h1>
                <p class="subtitle" style="margin-top:6px">We'll send a 6-digit code straight to your inbox.</p>
                </div>
                <div class="field">
                <label for="email-input">Email address</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M2 7l10 7 10-7"/>
                    </svg>
                    <input name="email" type="email" id="email-input" placeholder="you@gmail.com" autocomplete="email"/>
                </div>
                <div class="domain-tag" id="domain-pills"></div>
                <p class="error-msg" id="email-error">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="email-error-text" style="color:white">Please enter a valid email.</span>
                </p>
                </div>
                <a  class="btn" id="send-btn" onclick="handleSendCode()">Send verification code →</a>
                <input type="Submit" hidden id="btnSubmit_request"/>
            </form>
        </div>
