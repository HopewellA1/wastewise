{% extends "auth/base.html" %}

{% block hide_nav %}{% endblock %}
{% block hide_footer %}{% endblock %}

{% block content %}
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/auth/login.css') }}">
    <!-- reCAPTCHA script -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        .page {
            max-width: 620px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .card {
            width: 100%;
            padding: 2.6rem 3rem;
        }
        /* reCAPTCHA styling */
        .g-recaptcha {
            display: flex;
            justify-content: center;
            margin: 20px 0 10px 0;
        }
        .recaptcha-error {
            text-align: center;
            font-size: 12px;
            color: #dc3545;
            margin-top: 5px;
            margin-bottom: 10px;
        }
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>

    <section>
        <div class="page">
            <!-- Brand -->
            <div class="brand">
                <div class="brand-logo">
                    <div class="brand-icon">♻</div>
                    <span class="brand-name">WasteWise</span>
                </div>
                <div class="brand-tag">Local Recycling Initiative Tracker</div>
            </div>

            <!-- White card -->
            <div class="card">
                <!-- Centred heading like Image 1 -->
                <div class="card-head">
                    <div class="card-title">Welcome</div>
                    <div class="card-sub">Log in to continue to your dashboard</div>
                </div>

                <form method="POST" action="/auth/login" id="loginForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="field">
                        <label class="flabel">Email Address</label>
                        <input type="email" name="email" autocomplete="email" required/>
                    </div>

                    <div class="field">
                        <div class="lrow">
                            <label class="flabel">Password</label>
                            <a href="{{url_for('/auth.reset_request')}}" class="forgot">Forgot Password?</a>
                        </div>
                        <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required/>
                    </div>

                   

                    <!-- reCAPTCHA widget -->
                    <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
                    <div id="recaptchaError" class="recaptcha-error"></div>

                    <button type="submit" class="btn" id="loginBtn">Log In</button>
                </form>

                <div class="div"><span>or </span></div>

                <div class="foot">
                    <a href="{{url_for('/auth.signup')}}">Create a free account</a>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Wait for DOM to be fully loaded
        document.addEventListener("DOMContentLoaded", function() {
            const loginForm = document.getElementById("loginForm");
            const loginBtn = document.getElementById("loginBtn");
            const recaptchaError = document.getElementById("recaptchaError");

            if (loginForm) {
                loginForm.addEventListener("submit", function(e) {
                    // Check if grecaptcha is available and get response
                    if (typeof grecaptcha !== 'undefined') {
                        const response = grecaptcha.getResponse();
                        
                        if (!response) {
                            e.preventDefault();
                            if (recaptchaError) {
                                recaptchaError.innerHTML = "Please complete the reCAPTCHA verification.";
                            }
                            return false;
                        } else {
                            if (recaptchaError) {
                                recaptchaError.innerHTML = "";
                            }
                        }
                    } else {
                        // If grecaptcha not loaded yet, show error
                        e.preventDefault();
                        if (recaptchaError) {
                            recaptchaError.innerHTML = "reCAPTCHA is loading. Please wait and try again.";
                        }
                        return false;
                    }
                    
                    // Disable button to prevent double submission
                    if (loginBtn) {
                        loginBtn.disabled = true;
                        loginBtn.textContent = "Logging in...";
                    }
                    
                    return true;
                });
            }
        });
        
        // Optional: Handle reCAPTCHA expiration
        window.recaptchaExpired = function() {
            const recaptchaError = document.getElementById("recaptchaError");
            if (recaptchaError) {
                recaptchaError.innerHTML = "reCAPTCHA expired. Please verify again.";
            }
            const loginBtn = document.getElementById("loginBtn");
            if (loginBtn) {
                loginBtn.disabled = false;
                loginBtn.textContent = "Log In";
            }
        };
        
        // Optional: Clear error when reCAPTCHA is solved
        window.recaptchaSuccess = function() {
            const recaptchaError = document.getElementById("recaptchaError");
            if (recaptchaError) {
                recaptchaError.innerHTML = "";
            }
        };
    </script>
{% endblock %}
