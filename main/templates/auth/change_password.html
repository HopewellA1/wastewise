{% extends "default/base.html" %}
{% block content %}

    <link rel="stylesheet" href="{{ url_for('static', filename='default/css/auth.css') }}">

    <section class="hero">

        <div class="card">
            <div class="card-header">
                <div>
                    <a href="{{url_for('/auth.account', id=user.id)}}"><<< {{user.email}}</a>
                </div>
                <h3>
                    <b>
                        Change password
                    </b>
                </h1>
            </div>
            <div class="card-body">
                <form method="POST" action="{{url_for('/auth.change_password', id=user.id)}}" class="form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label">Old password</label>
                        <input type="password" name="old_password" class="form-control" placeholder="password" required>
                    </div>

                    
                    <div class="mb-3">
                        <label class="form-label">new password</label>
                        <input type="password" name="new_password" class="form-control" placeholder="password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm new Password</label>
                        <input type="password" name="new_password2" class="form-control" placeholder="re-enter password" required>
                    </div>
                    <button class='btn btn-primary' type="submit">Submit</button>
                </form>

            </div>

        </div>

    </section>

{% endblock %}
