<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">

  <a href="#how" onclick="closeMobile()">How It Works</a>

  <a href="#impact" onclick="closeMobile()">Impact</a>
  <div class="m-auth-row">

<div class="wrap">

 


    {% block content %}
    
    {% endblock  %}


 

</div>

<script>
  function scrollToHow() {
    document.getElementById('how').scrollIntoView({ behavior: 'smooth' });
  }

  const tb = document.getElementById('topbar');
  window.addEventListener('scroll', () => tb.classList.toggle('stuck', scrollY > 50));

  document.getElementById('burgerBtn').onclick = () => document.getElementById('mobileMenu').classList.add('open');
  document.getElementById('menuClose').onclick  = () => document.getElementById('mobileMenu').classList.remove('open');
  function closeMobile() { document.getElementById('mobileMenu').classList.remove('open'); }

  function countUp(el, target, dur) {
    let s = null;
    const fn = ts => {
      if (!s) s = ts;
      const p = Math.min((ts - s) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.floor(e * target).toLocaleString() + '+';
      if (p < 1) requestAnimationFrame(fn);
    };
    requestAnimationFrame(fn);
  }

  const ro = new IntersectionObserver(entries => {
    entries.forEach((en, i) => {
      if (en.isIntersecting) { setTimeout(() => en.target.classList.add('on'), i * 60); ro.unobserve(en.target); }
    });
  }, { threshold: .1 });
  document.querySelectorAll('.rv').forEach(e => ro.observe(e));

  const io = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) {
      countUp(document.getElementById('iw'), 1200, 1800);
      countUp(document.getElementById('iu'), 350,  1800);
      countUp(document.getElementById('ip'), 2000, 1800);
      io.disconnect();
    }
  }, { threshold: .3 });
  io.observe(document.getElementById('impact'));

  const rwo = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) {
      countUp(document.getElementById('pts-cnt'), 580, 1500);
      document.querySelectorAll('.pb-f').forEach(b => {
        setTimeout(() => b.style.width = b.dataset.w, 300);
      });
      rwo.disconnect();
    }
  }, { threshold: .3 });
  rwo.observe(document.getElementById('rewards'));
</script>

</body>
</html>
