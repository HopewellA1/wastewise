{% extends "default/base.html" %}
{% block content %}

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/reset_request.css') }}">



    <section class="hero">

        <div class="card" id="card">

        <div class="step active fade-up" id="step-email">
            <form method="post" action="{{url_for('/auth.reset_request')}}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="icon-wrap">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M2 7l10 7 10-7"/>
                </svg>
                </div>
                <div>
                <h1>Verify your email</h1>
                <p class="subtitle" style="margin-top:6px">We'll send a 6-digit code straight to your inbox.</p>
                </div>
                <div class="field">
                <label for="email-input">Email address</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M2 7l10 7 10-7"/>
                    </svg>
                    <input name="email" type="email" id="email-input" placeholder="you@gmail.com" autocomplete="email"/>
                </div>
                <div class="domain-tag" id="domain-pills"></div>
                <p class="error-msg" id="email-error">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="email-error-text" style="color:white">Please enter a valid email.</span>
                </p>
                </div>
                <a  class="btn" id="send-btn" onclick="handleSendCode()">Send verification code →</a>
                <input type="Submit" hidden id="btnSubmit_request"/>
            </form>
        </div>
        <!--Here:class="step" id="step-code"-->
        <div class="step" id="step-code">
            <div class="icon-wrap">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="11" width="14" height="10" rx="2"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                <circle cx="12" cy="16" r="1" fill="#38bdf8"/>
            </svg>
            </div>
            <div>
            <h1>Check your inbox</h1>
            <p class="subtitle" style="margin-top:6px">
                A 6-digit code was sent to <span class="highlight" id="email-display"></span>
            </p>
            </div>
            <div class="code-row">
            <input class="code-input" type="text" inputmode="numeric" maxlength="1"/>
            <input class="code-input" type="text" inputmode="numeric" maxlength="1"/>
            <input class="code-input" type="text" inputmode="numeric" maxlength="1"/>
            <input class="code-input" type="text" inputmode="numeric" maxlength="1"/>
            <input class="code-input" type="text" inputmode="numeric" maxlength="1"/>
            <input class="code-input" type="text" inputmode="numeric" maxlength="1"/>
            </div>
            <div class="timer-bar-wrap">
            <div class="timer-bar" id="timer-bar" style="width:100%"></div>
            </div>
            <p class="status-msg" id="status-msg"></p>
            <div class="resend-row">
            <span class="resend-text">Didn't receive it?</span>
            <button class="resend-btn" id="resend-btn" onclick="handleResend()" disabled>Resend code</button>
            </div>
            <button class="back-btn" onclick="goBack()">← Change email</button>
        </div>
        <!--
        <div class="step" id="step-success">
            <div class="check-circle pop-in">
            <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
                <circle cx="25" cy="25" r="24" stroke="#34d399" stroke-width="1.5" opacity="0.35"/>
                <path class="check-path" d="M15 25l8 8 14-16" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            </div>
            <h1>Email verified!</h1>
            <p class="subtitle">
            <span class="highlight" id="success-email"></span> has been verified. You're all set to continue.
            </p>
            <button class="btn green" onclick="resetFlow()">Continue to registration →</button>
        </div>
        -->

        </div>

    </section>

    <script src="{{url_for('static', filename='default/js/reset_request.js') }}"></script>


{% endblock %}
