{% extends "default/base.html" %}
{% block content %}
    <link rel="stylesheet" href="{{ url_for('static', filename='default/css/auth.css') }}">

    <section>

        <div class="card">
            <div class="card-header">
                New recycler
            </div>

            <div class="card-body">
                <form method="post" action="{{url_for('/participant.new_participant', user_id=user.id)}}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="PhoneNumber" class="form-control" placeholder="Phone Number"  required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Physical Address</label>
                        <input type="text" name="PhysicalAddress" class="form-control" placeholder="Physical Address"  required>
                    </div>
                    <button class='btn btn-primary' type="submit">Submit</button>


                </form>
            </div>

            <div class="card-footer">


            </div>


        </div>
    </section>

{% endblock %}
